name: Keepa Discovery

on:
  schedule:
    # Separate cron identities let delayed GitHub runs retain their intended stream.
    - cron: "10 5 * * *"
    - cron: "10 9 * * *"
    - cron: "10 13 * * *"
    - cron: "10 17 * * *"
  workflow_dispatch:
    inputs:
      stream_name:
        description: Discovery stream to run
        required: true
        default: woodworking_core
        type: choice
        options:
          - woodworking_core
          - power_tools
          - three_d_printing
          - deals_for_dudes

permissions:
  contents: read

concurrency:
  group: keepa-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Select stream
        id: stream
        env:
          MANUAL_STREAM: ${{ inputs.stream_name }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            stream="$MANUAL_STREAM"
          else
            case "$SCHEDULE" in
              "10 5 * * *") stream="woodworking_core" ;;
              "10 9 * * *") stream="power_tools" ;;
              "10 13 * * *") stream="three_d_printing" ;;
              "10 17 * * *") stream="deals_for_dudes" ;;
              *)
                echo "::error::No stream is mapped to schedule: $SCHEDULE"
                exit 1
                ;;
            esac
          fi

          echo "name=$stream" >> "$GITHUB_OUTPUT"
          echo "Selected stream: $stream"

      - name: Run discovery
        env:
          APP_URL: ${{ secrets.APP_URL }}
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          STREAM_NAME: ${{ steps.stream.outputs.name }}
        run: |
          set -euo pipefail

          if [[ -z "$APP_URL" || -z "$AUTOMATION_SECRET" ]]; then
            echo "::error::Add APP_URL and AUTOMATION_SECRET as repository Actions secrets."
            exit 1
          fi

          payload="$(printf '{"streamName":"%s"}' "$STREAM_NAME")"

          curl_args=(
            --fail-with-body
            --silent
            --show-error
            --retry 2
            --retry-all-errors
            --connect-timeout 15
            --max-time 180
            --request POST
            --header "Authorization: Bearer $AUTOMATION_SECRET"
            --header "Content-Type: application/json"
            --data "$payload"
          )

          curl "${curl_args[@]}" "${APP_URL%/}/api/automation/run-stream"

          echo
          echo "Keepa discovery completed for $STREAM_NAME."
