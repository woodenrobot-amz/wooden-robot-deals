<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Offline | Wooden Robot</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #09090b;
        color: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }
      main { width: 100%; max-width: 420px; }
      .brand {
        color: #fbbf24;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }
      h1 { margin: 12px 0 8px; font-size: 32px; line-height: 1.05; }
      p { color: #a1a1aa; line-height: 1.5; }
      button {
        margin-top: 16px;
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        background: #fbbf24;
        color: #09090b;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Wooden Robot</div>
      <h1>No connection.</h1>
      <p>
        We can’t pull current deal prices right now. Reconnect and try again
        before buying—Amazon prices and availability can change.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
